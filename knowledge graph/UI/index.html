<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local GraphRAG</title><style>
body{font-family:system-ui,sans-serif;max-width:960px;margin:32px auto;padding:0 16px;background:#f6f7fb;color:#172033}h1{margin-bottom:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:720px){.grid{grid-template-columns:1fr}}section{background:white;border:1px solid #e1e5ef;border-radius:14px;padding:22px}button{background:#405bd8;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:650;cursor:pointer}input,textarea{width:100%;padding:10px;border:1px solid #bbc3d1;border-radius:8px;margin:10px 0}textarea{min-height:76px}small,.muted{color:#667085}.stage{padding:8px;border-bottom:1px solid #eef0f5}.pending{color:#667085}.running{color:#a55a00}.completed{color:#168044}.failed{color:#b42318}.skipped{color:#667085}pre{white-space:pre-wrap;line-height:1.45;background:#f7f8fc;padding:12px;border-radius:8px}.source{font-size:.9rem;border-left:3px solid #405bd8;padding:8px 10px;margin:8px 0;background:#f8f9fe}</style></head>
<body><h1>Local GraphRAG</h1><p class="muted">Upload a document, follow its pipeline in real time, and ask grounded questions as soon as its source chunks are searchable.</p>
<div class="grid"><section><h2>1. Upload</h2><input id="file" type="file" accept=".txt,.pdf,.docx"><button id="upload">Upload and process</button><p id="uploadMessage" class="muted"></p><div id="stages"></div></section>
<section><h2>2. Ask your document</h2><p class="muted">The answer only uses retrieved chunks and the facts already extracted. You can ask while fact extraction is still running.</p><textarea id="question" placeholder="Example: What topics are in Python and which semester are they taught in?"></textarea><button id="ask">Ask</button><div id="answer"></div></section></div>
<script>
let documentId=null,poller=null;const $=id=>document.getElementById(id);function esc(value){const d=document.createElement('div');d.textContent=value;return d.innerHTML}
async function poll(){if(!documentId)return;const r=await fetch(`/api/jobs/${documentId}`);if(!r.ok)return;const job=await r.json();$('uploadMessage').textContent=`${job.filename}: ${job.state}${job.error?` — ${job.error}`:''}`;$('stages').innerHTML=Object.entries(job.stages).map(([name,s])=>`<div class="stage ${s.state}"><strong>${esc(name.replaceAll('_',' '))}</strong>: ${esc(s.state)} ${s.progress?`(${s.progress}%)`:''}<br><small>${esc(s.detail||'Waiting')}</small></div>`).join('');if(['completed','failed'].includes(job.state)){clearInterval(poller);poller=null}}
$('upload').onclick=async()=>{const file=$('file').files[0];if(!file){$('uploadMessage').textContent='Choose a TXT, PDF, or DOCX file first.';return}$('upload').disabled=true;$('uploadMessage').textContent='Uploading…';const form=new FormData();form.append('file',file);try{const r=await fetch('/api/documents',{method:'POST',body:form}),data=await r.json();if(!r.ok)throw new Error(data.detail||'Upload failed');documentId=data.document_id;$('uploadMessage').textContent='Upload complete; processing started.';await poll();poller=setInterval(poll,1800)}catch(e){$('uploadMessage').textContent=e.message}finally{$('upload').disabled=false}};
$('ask').onclick=async()=>{const question=$('question').value.trim();if(!question)return;$('answer').innerHTML='<p class="muted">Searching available knowledge…</p>';try{const r=await fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,document_id:documentId})}),data=await r.json();if(!r.ok)throw new Error(data.detail||'Question failed');const sources=(data.sources||[]).map(s=>`<div class="source"><strong>${esc(s.filename||'source')} · chunk ${esc(s.chunk_id)} · score ${esc(s.score)}</strong><br>${esc(s.text.slice(0,500))}</div>`).join('');$('answer').innerHTML=`<h3>Answer</h3><pre>${esc(data.answer)}</pre><h3>Sources</h3>${sources||'<p class="muted">No source chunks yet.</p>'}`}catch(e){$('answer').innerHTML=`<p class="failed">${esc(e.message)}</p>`}};
</script></body></html>
